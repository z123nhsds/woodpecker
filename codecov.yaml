ignore:
  - '**/mocks/mock_*.go'
  - '**/fixtures/*.go'
  - 'e2e/**/*.go'

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        target: 70%
        threshold: 0%
        if_ci_failed: error
        only_pulls: true
        flags:
          - unittests
    changes:
      default:
        target: 70%
        if_ci_failed: error
        only_pulls: true

flags:
  unittests:
    paths:
      - '**/*.go'
    carryforward: false

comment:
  layout: 'reach, diff, flags, files'
  behavior: default
  require_changes: true
  require_head: true
  show_carryforward_flags: false
