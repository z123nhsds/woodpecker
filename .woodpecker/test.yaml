variables:
  - &golang_image 'docker.io/golang:1.26'
  - &when
    - path: &when_path # related config files
        - '.woodpecker/test.yaml'
        - '.golangci.yaml'
        # go source code
        - '**/*.go'
        - 'go.*'
        # schema changes
        - 'pipeline/schema/**'
        # tools updates
        - Makefile
        - 'codecov.yaml'
      event: pull_request

when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: *when_path

steps:
  vendor:
    image: *golang_image
    commands:
      - go mod vendor
    when:
      path:
        - <<: *when_path
        - '.woodpecker/**'

  lint-pipeline:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - go run go.woodpecker-ci.org/woodpecker/v3/cmd/cli lint
    environment:
      WOODPECKER_DISABLE_UPDATE_CHECK: true
      WOODPECKER_LINT_STRICT: true
      WOODPECKER_PLUGINS_PRIVILEGED: 'docker.io/woodpeckerci/plugin-docker-buildx'
    when:
      - event: pull_request
        path:
          - '.woodpecker/**'

  dummy-web:
    image: *golang_image
    commands:
      - mkdir -p web/dist/
      - echo "test" > web/dist/index.html
    when:
      - path: *when_path

  lint:
    depends_on:
      - vendor
    image: golangci/golangci-lint:v2.12.2
    commands:
      - make lint
    when: *when

  check-openapi:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - 'make generate-openapi'
      - 'DIFF=$(git diff | head)'
      - '[ -n "$DIFF" ] && { echo "openapi not up to date, exec `make generate-openapi` and commit"; exit 1; } || true'
    when: *when

  lint-license-header:
    image: *golang_image
    commands:
      - make install-addlicense # cspell:words addlicense
      - bash -c 'shopt -s globstar; addlicense -check -ignore "vendor/**" -ignore cmd/server/openapi/docs.go **/*.go'
    when: *when

  test:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - make test-agent
      - make test-server
      - make test-cli
      - make test-lib
    when:
      - path: *when_path

  test-e2e:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - make test-e2e
    when:
      - path: *when_path

  sqlite:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      WOODPECKER_DATABASE_DRIVER: sqlite3
    commands:
      - make test-server-datastore-coverage
    when:
      - path: *when_path

  postgres:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      WOODPECKER_DATABASE_DRIVER: postgres
      WOODPECKER_DATABASE_DATASOURCE: 'host=postgres user=postgres dbname=postgres sslmode=disable' # cspell:disable-line
    commands:
      - make test-server-datastore
    when: *when

  mysql:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      WOODPECKER_DATABASE_DRIVER: mysql
      WOODPECKER_DATABASE_DATASOURCE: root@tcp(mysql:3306)/test?parseTime=true
    commands:
      - make test-server-datastore
    when: *when

  incremental-coverage-gate:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - make test-lib
      - make test-server
      - |
        COVER_FILE=coverage.out
        COVERAGE=$(go tool cover -func=$COVER_FILE | tail -1 | awk '{print $3}' | sed 's/%//')
        echo "Overall coverage: ${COVERAGE}%"
        if [ -n "$CI_PULL_REQUEST_LINK" ]; then
          echo "PR detected, checking patch coverage..."
          go install github.com/ory/go-acc@latest
          go-acc ./... --ignore mocks,fixtures,e2e --output tmp-coverage.out
          PATCH_COV=$(go tool cover -func=tmp-coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Patch coverage: ${PATCH_COV}%"
          if (( $(echo "$PATCH_COV < 70" | bc -l) )); then
            echo "ERROR: Patch coverage ${PATCH_COV}% is below the 70% threshold"
            exit 1
          fi
          echo "Patch coverage ${PATCH_COV}% meets the 70% threshold"
        fi
    when:
      - event: pull_request
        path: *when_path
    failure: ignore

  codecov:
    depends_on:
      - test
      - sqlite
    pull: true
    image: docker.io/woodpeckerci/plugin-codecov:2.3.1
    settings:
      files:
        - agent-coverage.out
        - cli-coverage.out
        - coverage.out
        - server-coverage.out
        - datastore-coverage.out
        - e2e-coverage.out
      token:
        from_secret: codecov_token
    when:
      - path: *when_path
    failure: ignore

services:
  postgres:
    image: docker.io/postgres:18
    ports: ['5432']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    when: *when

  mysql:
    image: docker.io/mysql:9.7.0
    ports: ['3306']
    environment:
      MYSQL_DATABASE: test
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    when: *when
