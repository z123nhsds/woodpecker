# cSpell:ignore checkmake hadolint autofix autoupdate
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.sql$'
      - id: trailing-whitespace
        exclude: ^docs/versioned_docs/.+/40-cli.md$
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        exclude: '^(docs/versioned_docs/.*|CHANGELOG.md)$'
        language_version: 24.14.0
  - repo: https://github.com/mrtazz/checkmake
    rev: v0.3.2
    hooks:
      - id: checkmake
        exclude: '^docker/Dockerfile.make$' # actually a Dockerfile and not a makefile
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c=.yamllint.yaml]
  - repo: local
    hooks:
      - id: no-fmt-println
        name: Reject fmt.Println in Go files
        description: Prevent accidental commit of fmt.Println debug statements
        entry: |
          bash -c '
            files=""
            for f in "$@"; do
              if grep -n "fmt\.Println" "$f" 2>/dev/null; then
                files="$files $f"
              fi
            done
            if [ -n "$files" ]; then
              echo "ERROR: Found fmt.Println in the following files:"
              for f in $files; do
                echo "  $f"
              done
              echo "Use a proper logger (e.g. zerolog) instead of fmt.Println for debugging."
              exit 1
            fi
          ' --
        language: system
        types_or: [go]
        exclude: '(_test\.go|vendor/|\.git/)'
        pass_filenames: true
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks [CI SKIP]

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: quarterly
  # NB: hadolint not included in pre-commit.ci
  skip: [check-hooks-apply, check-useless-excludes, hadolint, prettier, golangci-lint]
  submodules: false
