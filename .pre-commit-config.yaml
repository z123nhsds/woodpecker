# cSpell:ignore checkmake hadolint autofix autoupdate
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.sql$'
      - id: trailing-whitespace
        exclude: ^docs/versioned_docs/.+/40-cli.md$
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        exclude: '^(docs/versioned_docs/.*|CHANGELOG.md)$'
        language_version: 24.14.0
  - repo: https://github.com/mrtazz/checkmake
    rev: v0.3.2
    hooks:
      - id: checkmake
        exclude: '^docker/Dockerfile.make$' # actually a Dockerfile and not a makefile
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c=.yamllint.yaml]
  - repo: local
    hooks:
      - id: forbid-added-fmt-println
        name: Reject newly added fmt.Println in Go files.
        entry: "bash -ec 'if git diff --cached --unified=0 -- \"$@\" | grep -E \"^\\+.*fmt\\.Println\\s*\\(\" >/dev/null; then echo \"Remove fmt.Println debug statements before committing.\"; exit 1; fi' --"
        language: system
        types: [go]
        pass_filenames: true
      - id: yaml-file-extension
        name: Check if YAML files has *.yaml extension.
        entry: YAML filenames must have .yaml extension.
        language: fail
        files: .yml$
        exclude: '^(.gitpod.yml|.github/ISSUE_TEMPLATE/config.yml)$'
ci:
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: quarterly
  # NB: hadolint not included in pre-commit.ci
  skip: [check-hooks-apply, check-useless-excludes, hadolint, prettier, golangci-lint]
  submodules: false
