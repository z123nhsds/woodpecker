coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 70%
        threshold: 5%
        if_ci_failed: error
        only_pulls: true

ignore:
  - '**/mocks/mock_*.go'
  - '**/fixtures/*.go'
  - 'e2e/**/*.go'

comment:
  layout: 'header, diff, files'
  behavior: default
  require_changes: true
